
name: Deploy FilmCloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: cfut_yijLIj9UUrERKIrxuySQUAJ3PII9829HRnph3j5Q8d98c682
      CLOUDFLARE_ACCOUNT_ID: dc6e9a1346313b6872eeb13ffacebd10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript
        run: npm run check

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: cfut_yijLIj9UUrERKIrxuySQUAJ3PII9829HRnph3j5Q8d98c682
          accountId: dc6e9a1346313b6872eeb13ffacebd10
          command: deploy
